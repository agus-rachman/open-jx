holidays:
- id: au-sa.cal.holidays
  observe: Adelaide Cup Day and Proclamation Day apply; Christmas Eve and New Year's Eve are part-day
    public holidays (evening).
  authority: Public Holidays Act 2023 (SA)
  source_url: https://www.fairwork.gov.au/employment-conditions/public-holidays
  status: in-force
  verified: null
  verified_by: null
  note: Dated holiday table (with coverage dates and caveats) is in deadlines.yaml; use it, not memory.
