  observe: 'Periods in South Australia legislation are counted under the interpretation provision: the
    trigger day is excluded and a last day on a weekend or holiday moves to the next business day, subject
    to its terms.'
  authority: Legislation Interpretation Act 2021 (SA)
  source_url: https://www.legislation.sa.gov.au/
  status: in-force
  verified: null
  verified_by: null
