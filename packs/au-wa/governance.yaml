entries:
- id: au-wa.gov.associations
  applies_to:
  - association
  observe: If the governing body is an incorporated association, its minutes and resolutions follow the
    state Act and its rules, not the Corporations Act.
  authority: Associations Incorporation Act 2015 (WA)
  source_url: https://www.legislation.wa.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: Companies are covered by the au pack (Corporations Act 2001 (Cth)).
