  - id: wa-ia-s61
    citation: Interpretation Act 1984 (WA) s 61
    role: time_computation_and_rollover
    summary: 'Computation of time for a written law: a period reckoned from or after a specified day excludes
      that day (s 61(1)(b)) and a period ending on a specified day includes it (s 61(1)(d)); where the
      time limited for doing a thing expires or falls on an excluded day, the thing may be done on the
      next day that is not an excluded day (s 61(1)(e)); a number of days not expressed as clear days
      excludes the day of the first event and includes the day of the second (s 61(1)(g)); ''excluded
      day'' means Saturday, Sunday, public service holiday, and a bank holiday or public holiday throughout
      the State or in the relevant part of the State (s 61(2)). The Act applies to every written law,
      including subsidiary legislation, unless express provision is made to the contrary (s 3(1)).'
