  note: 'Verified against legislation.wa.gov.au on 2026-08-26. The Rules of the Supreme Court 1971 (RSC)
    carry their own time rules in Order 3: r 2(1) reckons days exclusively of the first and inclusively
    of the last day; r 2(2) drops Central-Office-closed days from periods of less than 7 days; r 3 excludes
    the period between 24 December and 15 January when computing time for filing, serving or amending
    a pleading or for filing and serving a notice of appeal; and r 4 extends a period that expires on
    a day the Central Office is closed to the next day it is open (not for documents that must be filed
    electronically, r 4(2)). The Interpretation Act 1984 s 61 applies to the rules as a written law (s
    3(1)) unless a contrary provision applies, and its rollover on ''excluded days'' (Saturday, Sunday,
    public service holiday, bank or public holiday) is what the script models with the WA holiday table;
    the script approximates Central-Office-closed days with weekends and public holidays, and every computed
    date carries a warning to confirm the office was open. The Supreme Court (Court of Appeal) Rules 2005
    must be read with the RSC (r 3(1)) and pick up RSC Order 3 other than rr 2(2) and 5(3) (r 3(4)). The
    period rules in this table are Supreme Court rules; the District Court Rules 2005 (consolidation 02-s0-00,
    current from 20 Aug 2025) and the Magistrates Court (Civil Proceedings) Rules 2005 (consolidation
    04-a0-00, current from 2 Jul 2026) carry their own procedural periods and were not verified for this
    table. The appearance rule stays pending-verification because the operative time is the time stated
    in the writ itself (RSC O 5 r 11).'
