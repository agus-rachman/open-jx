time_computation:
- id: au-wa.cal.interp
  observe: 'Periods in Western Australia legislation are counted under the interpretation provision: the
    trigger day is excluded and a last day on a weekend or holiday moves to the next business day, subject
    to its terms.'
  authority: Interpretation Act 1984 (WA) s 61
  source_url: https://www.legislation.wa.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: Section 61(2) also treats public service holidays and bank holidays as excluded days.
  provenance:
    source: https://github.com/l0cka/legal-skills
