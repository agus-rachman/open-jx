spelling: en-GB
terms:
- use: pursuer / defender
  instead_of: claimant / defendant
  note: Scottish civil procedure.
- use: delict
  instead_of: tort
  note: ''
- use: prescription
  instead_of: limitation (for extinction of obligations)
  note: Prescription and Limitation (Scotland) Act 1973.
- use: subscribed / self-proving (probative)
  instead_of: executed as a deed
  note: Requirements of Writing (Scotland) Act 1995.
- use: missives / disposition / standard security
  instead_of: contract for sale / transfer / mortgage
  note: Scottish conveyancing.
- use: interdict
  instead_of: injunction
  note: ''
- use: advocate / solicitor advocate
  instead_of: barrister
  note: Faculty of Advocates.
- use: Land and Buildings Transaction Tax (LBTT)
  instead_of: stamp duty land tax
  note: Revenue Scotland.
