holidays:
- id: au-tas.cal.holidays
  observe: Royal Hobart Regatta applies in southern Tasmania and Recreation Day in the north; Eight Hours
    Day replaces Labour Day.
  authority: Statutory Holidays Act 2000 (Tas)
  source_url: https://www.fairwork.gov.au/employment-conditions/public-holidays
  status: in-force
  verified: null
  verified_by: null
  note: Dated holiday table (with coverage dates and caveats) is in deadlines.yaml; use it, not memory.
