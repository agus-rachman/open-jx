entries:
- id: au-tas.exec.deed-individual
  applies_to:
  - individual
  - deed
  observe: A deed by an individual shows signature and attestation; confirm whether sealing wording is
    needed.
  authority: Conveyancing and Law of Property Act 1884 (Tas) s 63
  source_url: https://www.legislation.tas.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: pinpoint to be confirmed
- id: au-tas.exec.electronic
  applies_to:
  - individual
  - electronic
  - deed
  observe: The document is signed electronically, or a deed is executed electronically or witnessed by
    audio-visual link.
  authority: Electronic Transactions Act 2000 (Tas)
  source_url: https://www.legislation.tas.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: pinpoint to be confirmed
- id: au-tas.exec.poa
  applies_to:
  - attorney
  observe: A party signs by an attorney; the power of attorney and its form are governed by state or territory
    law.
  authority: Powers of Attorney Act 2000 (Tas)
  source_url: https://www.legislation.tas.gov.au/
  status: in-force
  verified: null
  verified_by: null
- id: au-tas.exec.duty
  applies_to:
  - company
  - individual
  observe: The document may be dutiable (for example transfers of land or business assets); duty and stamping
    are state matters.
  authority: Duties Act 2001 (Tas)
  source_url: https://www.legislation.tas.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: Observation only; whether duty is payable is a counsel decision.
