    warnings:
    - The defence must be attached to the notice of intention to defend (r 139(1)(b)), so this deadline
      is also the effective defence deadline.
    - Where the Service and Execution of Process Act 1992 (Cwlth) applies to interstate service, the time
      limited by that Act displaces the 28 days (r 137(2)); where the claim was served outside Australia
