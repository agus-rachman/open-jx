  note: 'Verified against legislation.qld.gov.au on 2026-08-14. The UCPR contains no time-reckoning rule
    of its own: the note to r 7 states that a time allowed or provided for under the rules is calculated
    according to the Acts Interpretation Act 1954 s 38, which applies to the UCPR through the Statutory
    Instruments Act 1992 s 14(1) and sch 1 (item ''parts 9-11''). The UCPR dictionary is schedule 3 and
    adopts the AIA sch 1 ''business day'' definition. Rollover under s 38(2) turns on ''excluded days''
    — for filing, days the registry is closed (s 38(5)(a)), and the registry closes on Saturdays, Sundays
    and court holidays (r 976); the script approximates registry-closed days with the weekend-and-public-holiday
    table, and every computed date carries a warning to confirm the registry was open.'
  computation_provisions:
  - id: qld-aia-s38
    citation: Acts Interpretation Act 1954 (Qld) s 38
    role: time_computation_and_rollover
    summary: 'Reckoning of time: a period beginning on a day, act or event excludes that day (s 38(1)),
      and a period of clear days or of at least a specified number of days also excludes the day on which
      the purpose is to be fulfilled (s 38(1)(a)); where the time or last day falls on an excluded day
      it moves to the next day that is not an excluded day (s 38(2)); ''excluded day'' means, for filing
      or registering a document, a day the office is closed, and otherwise a day that is not a business
      day in the place (s 38(5)); ''business day'' (sch 1) excludes Saturdays, Sundays and public, special
      and bank holidays.'
