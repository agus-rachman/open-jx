  note: 'Verified against legislation.vic.gov.au on 2026-08-14: NO general default review period exists.
    Neither the Victorian Civil and Administrative Tribunal Act 1998 (Authorised Version No. 145) nor
    the VCAT Rules 2018 (Authorised Version No. 019) fixes a period for review applications where the
    enabling enactment is silent — s 67 of the Act deals only with the form and manner of applications,
    and the phrase ''28 days'' does not appear in the current Rules. Each enabling enactment fixes its
    own period (many specify 28 days; planning matters 60 days), and s 126 of the Act permits extensions.
    The widely repeated general ''28 days'' derives from VCAT guidance, not legislation. No general period
    rule ships in this table; add enabling-enactment-specific rules per practice after verifying the conferring
    provision, in the pending-verification state until verify-deadline-basis confirms them.'
