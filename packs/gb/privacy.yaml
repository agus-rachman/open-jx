privacy_regimes:
- id: gb.privacy.uk-gdpr
  observe: 'General data protection law: the UK GDPR and the Data Protection Act 2018, applying across
    the UK to controllers and processors.'
  authority: UK GDPR; Data Protection Act 2018
  source_url: https://www.legislation.gov.uk/
  status: in-force
  verified: null
  verified_by: null
- id: gb.privacy.breach
  observe: 'Personal data breach: the controller notifies the regulator without undue delay and, where
    feasible, within 72 hours of becoming aware, unless the breach is unlikely to result in a risk to
    individuals; individuals are told without undue delay where the risk is high.'
  authority: UK GDPR arts 33-34
  source_url: https://ico.org.uk/
  status: in-force
  verified: null
  verified_by: null
- id: gb.privacy.processor
  observe: A processor notifies the controller without undue delay after becoming aware of a personal
    data breach.
  authority: UK GDPR art 33(2)
  source_url: https://ico.org.uk/
  status: in-force
  verified: null
  verified_by: null
- id: gb.privacy.duaa
  observe: The Data (Use and Access) Act 2025 amends the UK GDPR, the DPA 2018 and PECR in stages (for
    example a data-protection complaints procedure and recognised legitimate interests) and provides for
    an Information Commission.
  authority: Data (Use and Access) Act 2025
  source_url: https://www.legislation.gov.uk/ukpga/2025/18/contents
  status: in-force
  verified: null
  verified_by: null
  note: Commencement is staged by regulations; check which provisions are in force at the date that matters
- id: gb.privacy.pecr
  observe: The document involves electronic marketing, cookies or a communications-service security breach,
    which engage PECR (breach notification for service providers within 72 hours where feasible).
  authority: Privacy and Electronic Communications (EC Directive) Regulations 2003, SI 2003/2426
  source_url: https://ico.org.uk/
  status: in-force
  verified: null
  verified_by: null
  note: pinpoint to be confirmed against legislation.gov.uk
- id: gb.privacy.transfers
  observe: Personal data is transferred outside the UK; record the transfer mechanism named (adequacy
    regulations, the International Data Transfer Agreement or the UK Addendum).
  authority: UK GDPR ch V
  source_url: https://ico.org.uk/
  status: in-force
  verified: null
  verified_by: null
  note: pinpoint to be confirmed against legislation.gov.uk
