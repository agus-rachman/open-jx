    path: plugins/legal-skills/references/computation-rules/nsw-courts.json
    upstream_checked: '2026-08-14'
    upstream_state: verified
- id: au-nsw.cal.rules
  observe: Time limits in proceedings are counted under the court's own rules, which may displace the
    interpretation Act.
  authority: Uniform Civil Procedure Rules 2005 (NSW) r 1.11
  source_url: https://legislation.nsw.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: Interpretation Act 1987 (NSW) s 36 does not apply to periods under the UCPR (r 1.11(5)); for periods
    of 5 days or less, registry-closed days are excluded (r 1.11(3)).
  provenance:
    source: https://github.com/l0cka/legal-skills
    commit: 5bfb3d8
    path: plugins/legal-skills/references/computation-rules/nsw-courts.json
    upstream_checked: '2026-08-14'
