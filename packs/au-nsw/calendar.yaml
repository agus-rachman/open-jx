time_computation:
- id: au-nsw.cal.interp
  observe: 'Periods in New South Wales legislation are counted under the interpretation provision: the
    trigger day is excluded and a last day on a weekend or holiday moves to the next business day, subject
    to its terms.'
  authority: Interpretation Act 1987 (NSW) s 36
  source_url: https://legislation.nsw.gov.au/
  status: in-force
  verified: null
  verified_by: null
  provenance:
    source: https://github.com/l0cka/legal-skills
