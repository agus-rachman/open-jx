courts_ai:
- id: au-nsw.ai.sc-gen-23
  court: Supreme Court of New South Wales
  instrument: Practice Note SC Gen 23 — Use of Generative Artificial Intelligence (Gen AI)
  observe: Gen AI must not be used to generate the content of affidavits, witness statements, character
    references or other material intended to reflect a witness's evidence or opinion; such documents carry
    a statement that Gen AI was not used. Gen AI must not be used to draft or prepare expert reports without
    the Court's prior leave. Where Gen AI is used for written submissions or summaries, the author must
    verify that citations and references exist, are accurate and are relevant. Restrictions apply to entering
    material subject to non-publication or suppression orders, subpoenaed material and material produced
    under compulsion.
  restricted_content:
  - affidavit-content
  - witness-statement-content
  - character-reference-content
  - expert-report-without-leave
  authority: Practice Note SC Gen 23 — Use of Generative Artificial Intelligence (Gen AI)
  source_url: https://supremecourt.nsw.gov.au/
  status: in-force
  verified: null
  verified_by: null
