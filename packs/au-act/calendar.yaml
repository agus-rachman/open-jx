business_day: []
time_computation:
- id: au-act.cal.interp
  observe: 'Periods in Australian Capital Territory legislation are counted under the interpretation provision:
    the trigger day is excluded and a last day on a weekend or holiday moves to the next business day,
    subject to its terms.'
  authority: Legislation Act 2001 (ACT) ss 151, 151A and dictionary pt 1 (working day)
  source_url: https://www.legislation.act.gov.au/
  status: in-force
  verified: null
  verified_by: null
  provenance:
    source: https://github.com/l0cka/legal-skills
    commit: 5bfb3d8
    path: plugins/legal-skills/references/computation-rules/act-courts.json
    upstream_checked: '2026-08-26'
    upstream_state: verified
- id: au-act.cal.rules
  observe: Time limits in proceedings are counted under the court's own rules, which may displace the
    interpretation Act.
  authority: Court Procedures Rules 2006 (ACT) r 6300(1)
  source_url: https://www.legislation.act.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: The registry is closed between 26 December and 1 January (r 6300(1)(b)); a filing deadline landing
    then moves to the next working day.
  provenance:
    source: https://github.com/l0cka/legal-skills
    commit: 5bfb3d8
    path: plugins/legal-skills/references/computation-rules/act-courts.json
    upstream_checked: '2026-08-26'
    upstream_state: verified
- id: au-act.cal.court-rule-table
  observe: Candidate court and tribunal deadlines for this jurisdiction can be computed from the rule
    and holiday tables in deadlines.yaml; computation refuses when a rule or holiday table is not verified
    or the date is outside coverage.
  authority: Court Procedures Rules 2006 (ACT) r 6300(1)
  source_url: https://www.legislation.act.gov.au/
  status: guidance
  verified: null
  verified_by: null
  provenance:
