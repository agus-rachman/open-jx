    path: plugins/legal-skills/references/computation-rules/act-courts.json
    upstream_checked: '2026-08-26'
    upstream_state: verified
holidays:
- id: au-act.cal.holidays
  observe: Canberra Day (March) and Reconciliation Day (late May or early June) are ACT-specific.
  authority: Holidays Act 1958 (ACT)
  source_url: https://www.fairwork.gov.au/employment-conditions/public-holidays
  status: in-force
  verified: null
  verified_by: null
  note: Dated holiday table (with coverage dates and caveats) is in deadlines.yaml; use it, not memory.
limitation:
- id: au-act.cal.limitation
  observe: 'Candidate general limitation period for contract and tort claims governed by Australian Capital
    Territory law: 6 years, subject to the special regimes in the au pack and any extension or postponement
    provision.'
  authority: Limitation Act 1985 (ACT) s 11
  source_url: https://www.legislation.act.gov.au/
  status: in-force
  verified: null
  verified_by: null
  note: Candidate only; the applicable period is a counsel decision.
