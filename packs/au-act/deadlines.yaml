  - id: act-la-s151a
    citation: Legislation Act 2001 (ACT) s 151A and dictionary, pt 1 (working day)
    role: rollover
    summary: 'Periods of time ending on non-working days: if under an Act or statutory instrument something
      must or may be done on a particular day or within a particular period, and the day or the last day
      of the period is not a working day, it must or may be done on the next day that is a working day
      (s 151A(1)-(2)); the section is determinative for laws made or provisions inserted after 1 January
      2006 (s 151A(3)-(4)), which includes the Court Procedures Rules 2006. ''Working day'' means, for
      doing something at an office of a public entity, a day when the office is open, and otherwise a
      day that is not a Saturday, Sunday or public holiday at the place where the thing must be done (dictionary,
      pt 1).'
    source_url: https://www.legislation.act.gov.au/a/2001-14/
    evidence:
