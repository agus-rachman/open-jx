  holiday_table: act
  note: 'Verified against legislation.act.gov.au on 2026-08-26. The Court Procedures Rules 2006 contain
    no time-reckoning rule of their own; the Legislation Act 2001 applies to every ACT Act and statutory
    instrument, so periods under the rules are worked out under s 151 (table item 2: a period ''after''
    a stated day or event excludes that day) and roll under s 151A to the next ''working day'', which
    for a thing done at a court registry is a day the registry is open (dictionary, pt 1). Rule 6300(1)
    closes the registry on Saturdays, Sundays, public holidays, days between 26 December and 1 January,
    and days a registrar directs. The script approximates registry-open days with the weekend-and-public-holiday
    table; the 27-31 December closure is recorded as an uncertain window in that table so the script refuses
    rather than guesses, and every computed date carries a warning to confirm the registry was open. Legislation
    Act s 152 (continuing effect of obligations) is not a time-reckoning rule and is not tabled. Magistrates
    Court civil claims are governed by the same rules (CPR r 6(1)); no Magistrates Court-specific period
    is tabled. An entry returned to pending-verification fails closed until re-verified.'
  computation_provisions:
  - id: act-la-s151
    citation: Legislation Act 2001 (ACT) s 151
    role: time_computation
    summary: 'Working out periods of time generally: applies to periods of 1 day or longer under an Act
      or statutory instrument (s 151(1)); by the table in s 151(2), a period described as beginning from
      or after a stated day, act or event does not include that day (item 2), a period described as ending
      at, by, on or with a stated day includes that day (item 3), and a period described as ending before
      a stated day excludes it (item 4).'
