- id: au.cal.limitation-defamation
  observe: 'Defamation: a one-year period from publication applies in every jurisdiction, subject to extension;
    Western Australia has not enacted the Stage 1 uniform reforms (single-publication rule), the Northern
    Territory has.'
  authority: State and territory limitation and defamation Acts
  source_url: https://www.legislation.gov.au/
