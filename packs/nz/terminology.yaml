spelling: en-NZ
terms:
  - use: barrister and solicitor / lawyer
    instead_of: attorney (except "power of attorney")
  - use: Limited / Ltd
    instead_of: Pty Ltd / Inc / LLC
    note: New Zealand companies do not use "Pty".
  - use: GST
    instead_of: VAT / sales tax
    note: Goods and Services Tax Act 1985.
  - use: Schedule
    instead_of: Exhibit
  - use: PPSA / PPSR
    instead_of: UCC Article 9 financing statement
    note: Personal Property Securities Act 1999.
  - use: Fair Trading Act 1986 / Consumer Guarantees Act 1993
    instead_of: Australian Consumer Law
    note: New Zealand consumer law differs from the Australian Consumer Law.
  - use: Te Tiriti o Waitangi / Treaty of Waitangi
    instead_of: ""
    note: Use the form the source document uses.
  - use: organisation, licence (noun), judgment
    instead_of: organization, license (noun), judgement
