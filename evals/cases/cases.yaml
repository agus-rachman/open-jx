  # ---- deadlines, limitation, citations and privacy (data from l0cka/legal-skills, MIT)

  - id: AU-NSW-DEADLINE-01
    title: NSW Supreme Court defence due date — computed by the script across the holidays
    jurisdictions: [au, au-nsw]
    original_skill: none
    fixtures: []
    prompt: Our client was served with a statement of claim in the Supreme Court of NSW on 23 December 2026. When is the defence due?
    expect:
      router: {packs: [au, au-nsw]}
      contains: [["2027-01-20", "20 January 2027"], ["r 14.3", "ucpr-defence-after-service"], ["candidate"]]
      parity: none

  - id: AU-FCA-DEADLINE-01
    title: Federal Court defence — 24 December to 14 January not counted
    jurisdictions: [au]
    original_skill: none
    fixtures: []
    prompt: A statement of claim in the Federal Court was served on our client on 1 December 2026. When is the defence due?
    expect:
      router: {packs: [au]}
      contains: [["2027-01-20", "20 January 2027"], ["r 1.61", "24 December"], ["candidate"]]
      parity: none

  - id: AU-VIC-DEADLINE-FC-01
    title: Fail closed — Victorian appearance rule not yet verified upstream
    jurisdictions: [au, au-vic]
    original_skill: none
    fixtures: []
    prompt: We served a writ in the Supreme Court of Victoria on 2 November 2026. When must the defendant file an appearance?
    expect:
      router: {packs: [au, au-vic]}
      contains: [["not verified", "pending-verification", "pending verification", "not been verified", "no date"]]
      forbidden: ["2026-11-12", "12 November 2026"]
      forbidden_regex: ["(?i)candidate date:\\s*\\d"]
      parity: none

  - id: AU-WA-DEADLINE-FC-01
    title: Fail closed — WA date outside the holiday table's coverage
    jurisdictions: [au, au-wa]
    original_skill: none
    fixtures: []
    prompt: In the Supreme Court of Western Australia the statement of claim was served on 20 December 2027 after the defendant entered an appearance. When is the defence due?
    expect:
      router: {packs: [au, au-wa]}
      contains: [["coverage", "does not cover", "outside", "not covered"]]
      forbidden_regex: ["(?i)candidate date:[^\\n]*2028"]
      parity: none

  - id: AU-CITE-01
    title: Citation check before Federal Court filing — publishers, access and outcomes
    jurisdictions: [au, au-nsw, au-vic]
    original_skill: none
    fixtures: []
    prompt: "Before we file in the Federal Court, check these citations: [2023] HCA 12; [2025] NSWSC 101; [2024] FCAFC 7; [2022] VSCA 3."
    expect:
