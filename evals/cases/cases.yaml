# open-jx side-by-side eval cases.
#
# Each case runs twice in Copilot Cowork with the same prompt and fixtures:
#   baseline — open-jx switched OFF in the conversation's Sources picker
#   addon    — open-jx switched ON (Legal for Cowork built-in skills in both runs)
# Answer intake questions with `answers` so both runs follow the same path.
#
# Assertion keys (see evals/score.py):
#   router.packs          pack ids that must appear in the "**Jurisdiction:**" brief (addon run)
#   router.exact          true = no other pack ids may appear
#   router.text           extra strings the brief block must contain (case-insensitive)
#   router.no_pack        true = brief must say no open-jx pack is installed
#   original.markers      case-sensitive strings from the Legal for Cowork output that must appear (both runs)
#   overlay.expected      true = a "#### Jurisdiction overlay —" section must appear; false = must not
#   overlay.refs          pack entry ids that must appear in the overlay section
#   overlay.mentions      strings that must appear in the overlay section (case-insensitive)
#   court_note.refs       entry ids that must appear in a "**Court AI note:**" block before the original output
#   sources_line          true = "Sources and citation per open-jx pack" line must appear
#   cite_regex            regex that must match somewhere in the addon output
#   contains              strings that must appear anywhere in the addon output; a nested list means any one of them
#   withheld              true = "Withheld under open-jx identifier rules" line must appear
#   forbidden             strings that must not appear anywhere in the addon output
#   forbidden_regex       regexes that must not match anywhere in the addon output
#   no_advice             true = advice wording must not appear in overlay or court note
#   parity                position | markers | none — compare baseline and addon original output
#   soft                  assertion names that count as warnings, not failures (e.g. overlay.mentions)

defaults:
  answers: ["In chat", "Use the default structure", "Proceed with the defaults"]
  no_advice: true

cases:
  - id: AU-NSW-EXEC-01
    title: NSW supply agreement — execution readiness with s 127 and ACN mismatch
    jurisdictions: [au, au-nsw]
    original_skill: check-execution-readiness
    fixtures: [nsw_supply_agreement.docx]
    prompt: Is this supply agreement ready to sign?
    expect:
      router: {packs: [au, au-nsw], exact: true}
      original: {markers: ["Execution readiness", "Position:"]}
      overlay: {expected: true, refs: [au.exec.s127-methods], mentions: ["ACN"]}
      withheld: true
      forbidden: ["123 456 782", "123456782"]
      parity: position

